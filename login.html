<!DOCTYPE html>
<html lang="en">
<head>
  <title>Login | Madisar Tales</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <div class="login-container">
    <div class="login-box">
      <h2>Welcome To Prime Membership</h2>
      <p class="tagline">Eat. Relish. Remember!</p>

      <form>
        <div class="input-group">
          <input type="email" required>
          <label>Email</label>
        </div>

        <div class="input-group">
          <input type="password" required>
          <label>Password</label>
        </div>

        <button type="submit">Login</button>

        <p class="register-text">
          New to Madisar Tales? <a href="#">Create Account</a>
        </p>
      </form>
    </div>
  </div>

</body>
</html>
